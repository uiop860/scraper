[tools]
node = "24.22.2"
"npm:web-ext" = "10.8.0"

[tasks.install]
description = "Install locked project dependencies and prepare WXT types"
run = "npm ci"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks.compile]
description = "Build the Firefox MV3 extension with WXT"
depends = ["install"]
run = "npm exec -- wxt build --browser firefox --mv3"

[tasks.dev]
description = "Run WXT with React hot reload in Firefox"
depends = ["install"]
run = ["mkdir -p .firefox-profile", "npm exec -- wxt --browser firefox --mv3"]

[tasks.typecheck]
description = "Prepare WXT types and check TypeScript"
depends = ["install"]
run = ["npm exec -- wxt prepare", "npm exec -- tsc --noEmit"]

[tasks.lint]
description = "Check types, ESLint, Prettier, and Mozilla extension rules"
depends = ["compile", "typecheck"]
run = ["npm exec -- eslint . --max-warnings 0", "npm exec -- prettier . --check", "web-ext lint --source-dir .output/firefox-mv3"]

[tasks.format]
description = "Format source and configuration with Prettier"
depends = ["install"]
run = "npm exec -- prettier . --write"

[tasks.build]
description = "Validate and package the Firefox extension with WXT"
depends = ["lint"]
run = "npm exec -- wxt zip --browser firefox --mv3"

[tasks.test]
description = "Test scraping fixtures, runtime traversal, OAuth and background isolation"
depends = ["install"]
run = "node --test tests/*.test.mjs"

[tasks."test:firefox"]
description = "Verify synthetic loopback interception in a temporary headless Firefox profile"
depends = ["compile"]
run = "node scripts/firefox-smoke.mjs"

[tasks."test:scraper:firefox"]
description = "Verify rendered scraping, pagination, detail visits and origin blocking in headless Firefox"
depends = ["compile"]
run = "node scripts/scraper-firefox-smoke.mjs"
